<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">

  <title>TOP POT - K BBQ & HOT POT</title>
  <style>
    :root { 
      --bg: #090909;
      --card-bg: #141414;
      --card-border: #262626;
      --accent: #e50914;
      --accent-hover: #b20710;
      --gold: #f5c518;
      --text-main: #ffffff;
      --text-muted: #888888;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      padding: 10px;
      padding-bottom: 120px;
    }

    /* 顶部导航栏布局 */
    header {
      position: relative;
      text-align: center;
      padding: 16px 0 12px 0;
      background: linear-gradient(180deg, #1f0505 0%, var(--bg) 100%);
      border-bottom: 2px solid var(--accent);
      margin-bottom: 12px;
      border-radius: 0 0 12px 12px;
      user-select: none;
    }

    /* 右上角语言切换按钮 */
    .lang-btn {
      position: absolute;
      top: 12px;
      right: 12px;
      background: #262626;
      color: #fff;
      border: 1px solid #404040;
      padding: 5px 10px;
      border-radius: 15px;
      font-size: 0.75rem;
      font-weight: bold;
      cursor: pointer;
    }

    h1 {
      color: var(--text-main);
      font-size: 1.8rem;
      letter-spacing: 3px;
      font-weight: 900;
      text-shadow: 0 2px 10px rgba(229, 9, 20, 0.5);
      margin-bottom: 2px;
      cursor: pointer;
    }

    h1 span {
      color: var(--accent);
    }

    .sub-title {
      font-size: 0.75rem;
      color: var(--text-muted);
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .table-badge {
      display: inline-block;
      background: rgba(229, 9, 20, 0.15);
      color: #ff6b6b;
      padding: 3px 14px;
      border-radius: 15px;
      font-size: 0.8rem;
      font-weight: 700;
      border: 1px solid rgba(229, 9, 20, 0.4);
    }

    /* 用餐时段选择器 (Lunch / Dinner) */
    .session-switcher {
      display: flex;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 4px;
      margin-bottom: 12px;
      gap: 4px;
    }

    .session-btn {
      flex: 1;
      background: transparent;
      color: var(--text-muted);
      border: none;
      padding: 10px;
      border-radius: 9px;
      font-size: 0.9rem;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
    }

    .session-btn.active {
      background: var(--accent);
      color: #fff;
      box-shadow: 0 2px 10px rgba(229, 9, 20, 0.4);
    }

    /* 大分区选择栏 (BBQ vs HOT POT) */
    .main-type-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
    }

    .main-tab {
      flex: 1;
      background: var(--card-bg);
      color: var(--text-main);
      border: 1px solid var(--card-border);
      padding: 10px;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: bold;
      text-align: center;
      cursor: pointer;
    }

    .main-tab.active {
      background: #262626;
      border-color: var(--accent);
      color: #fff;
    }

    /* 小分区横向滚动栏 */
    .sub-type-tabs {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 6px;
      margin-bottom: 12px;
      scrollbar-width: none;
    }
    .sub-type-tabs::-webkit-scrollbar {
      display: none;
    }

    .sub-tab {
      background: #1a1a1a;
      color: var(--text-muted);
      border: 1px solid var(--card-border);
      padding: 6px 14px;
      border-radius: 15px;
      font-size: 0.82rem;
      white-space: nowrap;
      cursor: pointer;
    }

    .sub-tab.active {
      background: var(--text-main);
      color: #000;
      font-weight: bold;
      border-color: var(--text-main);
    }

    /* 分类板块大标题 */
    .section-title {
      font-size: 1.05rem;
      color: #ff9999;
      margin: 14px 0 8px 4px;
      border-left: 3px solid var(--accent);
      padding-left: 8px;
      font-weight: bold;
    }

    /* 菜品列表 */
    .menu-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .item-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 10px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: opacity 0.2s;
    }

    .item-card.disabled-item {
      opacity: 0.35;
      background: #0d0d0d;
      border-color: #1a1a1a;
      pointer-events: none;
    }

    .item-info {
      flex: 1;
      padding-right: 8px;
    }

    .item-name {
      font-size: 0.96rem;
      font-weight: bold;
      margin-bottom: 2px;
      color: #fff;
    }

    .item-desc {
      font-size: 0.72rem;
      color: var(--text-muted);
      line-height: 1.25;
    }

    .dinner-tag {
      display: inline-block;
      background: rgba(229, 9, 20, 0.2);
      color: #ff6b6b;
      font-size: 0.65rem;
      padding: 1px 6px;
      border-radius: 4px;
      margin-top: 3px;
      border: 1px solid rgba(229, 9, 20, 0.4);
    }

    /* 数量控制器 */
    .qty-ctrl {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-qty {
      background: #262626;
      color: #fff;
      border: 1px solid #404040;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      font-size: 1rem;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .btn-qty:active {
      background: var(--accent);
    }

    .qty-num {
      font-weight: bold;
      font-size: 0.95rem;
      min-width: 15px;
      text-align: center;
    }

    /* 底部悬浮结算栏 */
    .bottom-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(12, 12, 12, 0.97);
      backdrop-filter: blur(10px);
      border-top: 1px solid var(--card-border);
      padding: 10px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 -4px 15px rgba(0,0,0,0.8);
      z-index: 100;
    }

    .total-label {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .total-amount {
      color: var(--gold);
      font-size: 1.15rem;
      font-weight: bold;
    }

    .btn-submit {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 10px 22px;
      border-radius: 22px;
      font-weight: bold;
      font-size: 0.9rem;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(229, 9, 20, 0.5);
    }

    .btn-submit:disabled {
      background: #262626;
      color: #666;
      box-shadow: none;
      cursor: not-allowed;
    }
  </style>
</head>

      clickCount++;

        const newTable = prompt(promptMsg, currentTable);
        
        if (newTable !== null && newTable.trim() !== "") {
          localStorage.setItem('top_pot_table', newTable.trim());
          updateTableDisplay();

        }
      }
    }

    function getTableNumber() {
      const urlParams = new URLSearchParams(window.location.search);
      let table = urlParams.get('table');
      if (table) {
        localStorage.setItem('top_pot_table', table);
      } else {
        table = localStorage.getItem('top_pot_table') || '1';
      }
      return table;

      {

      {

      {

      {

    function switchSession(session) {
      currentSession = session;
      document.getElementById('lunchBtn').classList.toggle('active', session === 'lunch');
      document.getElementById('dinnerBtn').classList.toggle('active', session === 'dinner');

      if (session === 'lunch') {
        for (const id in cart) {
          const item = menuData.find(i => i.id == id);
          if (item && item.dinnerOnly) delete cart[id];
        }
      }
      renderMenu();
    }

    function switchMainType(mainType) {
      currentMain = mainType;
      currentSub = 'all';
      document.getElementById('mainTab-bbq').classList.toggle('active', mainType === 'bbq');
      document.getElementById('mainTab-hotpot').classList.toggle('active', mainType === 'hotpot');
      renderSubTabs();
      renderMenu();
    }

    function renderSubTabs() {
      const subTabsContainer = document.getElementById('subTypeTabs');
      subTabsContainer.innerHTML = '';

      let subs = [];
      if (currentMain === 'bbq') {
        subs = currentLang === 'zh' ? [
          { key: 'all', name: '全部烤肉' },
          { key: 'beef', name: '🥩 烤牛肉' },
          { key: 'pork', name: '🥓 烤猪肉' },
          { key: 'seafood', name: '🦐 海鲜' },
          { key: 'chicken', name: '🍗 鸡肉' },
          { key: 'veg', name: '🥬 烤蔬菜' }
        ] : [
          { key: 'all', name: 'All BBQ' },
          { key: 'beef', name: '🥩 Beef' },
          { key: 'pork', name: '🥓 Pork' },
          { key: 'seafood', name: '🦐 Seafood' },
          { key: 'chicken', name: '🍗 Chicken' },
          { key: 'veg', name: '🥬 Veg' }
        ];
      } else {
        subs = currentLang === 'zh' ? [
          { key: 'all', name: '全部火锅' },
          { key: 'soup', name: '🍲 锅底' },
          { key: 'meat', name: '🥩 肉类' },
          { key: 'noodle', name: '🍜 主食' },
          { key: 'soybean', name: '🫘 豆制品' }
        ] : [
          { key: 'all', name: 'All Hot Pot' },
          { key: 'soup', name: '🍲 Soup' },
          { key: 'meat', name: '🥩 Meat' },
          { key: 'noodle', name: '🍜 Noodles' },
          { key: 'soybean', name: '🫘 Soybean' }
        ];
      }

      subs.forEach(s => {
        const btn = document.createElement('button');
        btn.className = `sub-tab ${currentSub === s.key ? 'active' : ''}`;
        btn.innerText = s.name;
        btn.onclick = () => {
          currentSub = s.key;
          renderSubTabs();
          renderMenu();
        };
        subTabsContainer.appendChild(btn);
      });
    }

    function renderMenu() {
      const list = document.getElementById('menuList');
      list.innerHTML = '';
      let totalCount = 0;

      let filteredItems = menuData.filter(i => i.main === currentMain);
      if (currentSub !== 'all') {
        filteredItems = filteredItems.filter(i => i.sub === currentSub);
      }

      let lastGroup = '';
      filteredItems.forEach(item => {
        const qty = cart[item.id] || 0;
        totalCount += qty;
        const isDinnerLocked = (currentSession === 'lunch' && item.dinnerOnly);

        const groupName = currentLang === 'zh' ? item.groupZh : item.groupEn;
        if (groupName !== lastGroup) {
          lastGroup = groupName;
          const groupTitle = document.createElement('div');
          groupTitle.className = 'section-title';
          groupTitle.innerText = lastGroup;
          list.appendChild(groupTitle);
        }

        const itemName = currentLang === 'zh' ? item.nameZh : item.nameEn;
        const itemDesc = currentLang === 'zh' ? item.descZh : item.descEn;
        const tagText = currentLang === 'zh' ? '🌙 仅限 Dinner 晚市提供' : '🌙 Dinner Only';

        const card = document.createElement('div');
        card.className = `item-card ${isDinnerLocked ? 'disabled-item' : ''}`;
        card.innerHTML = `
          <div class="item-info">
            <div class="item-name">${itemName}</div>
            <div class="item-desc">${itemDesc}</div>
            ${item.dinnerOnly ? `<div class="dinner-tag">${tagText}</div>` : ''}
          </div>
          <div class="qty-ctrl">
            ${qty > 0 ? `<button class="btn-qty" onclick="updateQty(${item.id}, -1)">-</button><span class="qty-num">${qty}</span>` : ''}
            <button class="btn-qty" ${isDinnerLocked ? 'disabled style="opacity:0.3"' : ''} onclick="updateQty(${item.id}, 1)">+</button>
          </div>
        `;
        list.appendChild(card);
      });

      const countText = currentLang === 'zh' ? `${totalCount} 份菜品` : `${totalCount} items`;
      document.getElementById('totalCountDisplay').innerText = countText;
      
      const submitBtn = document.getElementById('submitBtn');
      if (totalCount > 0) {
        submitBtn.disabled = false;
        submitBtn.innerText = currentLang === 'zh' ? `发送加单 (${totalCount}份) 🔥` : `Submit Order (${totalCount}) 🔥`;
      } else {
        submitBtn.disabled = true;
        submitBtn.innerText = currentLang === 'zh' ? "请选择菜品" : "Select Items";
      }
    }

    function updateQty(id, change) {
      cart[id] = (cart[id] || 0) + change;
      if (cart[id] <= 0) delete cart[id];
      renderMenu();
    }

    function submitOrder() {
      const orderItems = [];
      let totalCount = 0;

      for (const id in cart) {
        const item = menuData.find(i => i.id == id);
        if (item) {
          totalCount += cart[id];
          const n = currentLang === 'zh' ? item.nameZh : item.nameEn;
          orderItems.push(`- **${n}** x${cart[id]}`);
        }
      }

      if (orderItems.length === 0) return;

      let fullToken = "";
      try {
        fullToken = atob((s1 + s2).trim());
      } catch (e) {
        alert("❌ 密钥解密失败");
        return;
      }

      const currentTable = getTableNumber();
      const sessionName = currentSession === 'lunch' ? (currentLang === 'zh' ? 'Lunch 午市' : 'Lunch') : (currentLang === 'zh' ? 'Dinner 晚市' : 'Dinner');
      const issueTitle = `【${currentTable}号桌】${sessionName}加单 (${totalCount}份)`;
      const issueBody = `### 🍽️ 点单详情\n**桌号：** ${currentTable}号\n**时段：** ${sessionName}\n**时间：** ${new Date().toLocaleString()}\n\n**加点清单：**\n${orderItems.join('\n')}`;

      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;
      submitBtn.innerText = currentLang === 'zh' ? "正在呼叫后厨..." : "Sending...";

      fetch(`https://api.github.com/repos/${repoOwner}/${repoName}/issues`, {
        method: 'POST',
        headers: {
          'Authorization': `token ${fullToken}`,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          title: issueTitle,
          body: issueBody
        })
      })
      .then(res => {
        if (res.ok) {
          alert(currentLang === 'zh' ? `✅ 加单成功已送达后厨！\n桌号: ${currentTable}号 (${sessionName})` : `✅ Order sent successfully!\nTable: #${currentTable} (${sessionName})`);
          cart = {};
          renderMenu();
        } else {
          alert(`❌ 提交失败 Status: ${res.status}`);
          submitBtn.disabled = false;
          submitBtn.innerText = currentLang === 'zh' ? "发送加单 🔥" : "Submit Order 🔥";
        }
      })
      .catch(() => {
        alert('❌ 网络连接错误');
        submitBtn.disabled = false;
        submitBtn.innerText = currentLang === 'zh' ? "发送加单 🔥" : "Submit Order 🔥";
      });
    }

    renderSubTabs();
    renderMenu();
  </script>
</body>
