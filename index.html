<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TOP POT - K BBQ & HOT POT</title>
  <style>
    :root {
      --bg: #090909;
      --card-bg: #141414;
      --card-border: #262626;
      --accent: #e50914;
      --accent-hover: #b20710;
      --gold: #f5c518;
      --text-main: #ffffff;
      --text-muted: #888888;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      padding: 10px;
      padding-bottom: 120px;
    }

    header {
      position: relative;
      text-align: center;
      padding: 16px 0 12px 0;
      background: linear-gradient(180deg, #1f0505 0%, var(--bg) 100%);
      border-bottom: 2px solid var(--accent);
      margin-bottom: 12px;
      border-radius: 0 0 12px 12px;
      user-select: none;
    }

    .lang-btn {
      position: absolute;
      top: 12px;
      right: 12px;
      background: #262626;
      color: #fff;
      border: 1px solid #404040;
      padding: 5px 10px;
      border-radius: 15px;
      font-size: 0.75rem;
      font-weight: bold;
      cursor: pointer;
    }

    h1 {
      color: var(--text-main);
      font-size: 1.8rem;
      letter-spacing: 3px;
      font-weight: 900;
      text-shadow: 0 2px 10px rgba(229, 9, 20, 0.5);
      margin-bottom: 2px;
      cursor: pointer;
    }

    h1 span {
      color: var(--accent);
    }

    .sub-title {
      font-size: 0.75rem;
      color: var(--text-muted);
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .table-badge {
      display: inline-block;
      background: rgba(229, 9, 20, 0.15);
      color: #ff6b6b;
      padding: 3px 14px;
      border-radius: 15px;
      font-size: 0.8rem;
      font-weight: 700;
      border: 1px solid rgba(229, 9, 20, 0.4);
    }

    .session-switcher {
      display: flex;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 4px;
      margin-bottom: 12px;
      gap: 4px;
    }

    .session-btn {
      flex: 1;
      background: transparent;
      color: var(--text-muted);
      border: none;
      padding: 10px;
      border-radius: 9px;
      font-size: 0.9rem;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
    }

    .session-btn.active {
      background: var(--accent);
      color: #fff;
      box-shadow: 0 2px 10px rgba(229, 9, 20, 0.4);
    }

    .session-btn.disabled-btn, .main-tab.disabled-btn {
      opacity: 0.3;
      cursor: not-allowed;
      pointer-events: none;
    }

    .main-type-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
    }

    .main-tab {
      flex: 1;
      background: var(--card-bg);
      color: var(--text-main);
      border: 1px solid var(--card-border);
      padding: 10px;
      border-radius: 10px;
      font-size: 0.88rem;
      font-weight: bold;
      text-align: center;
      cursor: pointer;
    }

    .main-tab.active {
      background: #262626;
      border-color: var(--accent);
      color: #fff;
    }

    .sub-type-tabs {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 6px;
      margin-bottom: 12px;
      scrollbar-width: none;
    }
    .sub-type-tabs::-webkit-scrollbar {
      display: none;
    }

    .sub-tab {
      background: #1a1a1a;
      color: var(--text-muted);
      border: 1px solid var(--card-border);
      padding: 6px 14px;
      border-radius: 15px;
      font-size: 0.82rem;
      white-space: nowrap;
      cursor: pointer;
    }

    .sub-tab.active {
      background: var(--text-main);
      color: #000;
      font-weight: bold;
      border-color: var(--text-main);
    }

    .section-title {
      font-size: 1.05rem;
      color: #ff9999;
      margin: 14px 0 8px 4px;
      border-left: 3px solid var(--accent);
      padding-left: 8px;
      font-weight: bold;
    }

    .menu-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .item-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 10px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: opacity 0.2s;
    }

    .item-card.disabled-item {
      opacity: 0.35;
      background: #0d0d0d;
      border-color: #1a1a1a;
      pointer-events: none;
    }

    .item-info {
      flex: 1;
      padding-right: 8px;
    }

    .item-name {
      font-size: 0.96rem;
      font-weight: bold;
      margin-bottom: 2px;
      color: #fff;
    }

    .item-desc {
      font-size: 0.72rem;
      color: var(--text-muted);
      line-height: 1.25;
    }

    .item-price {
      font-size: 0.85rem;
      color: var(--gold);
      font-weight: bold;
      margin-top: 2px;
    }

    /* 猪肉/清真 提示标签 */
    .diet-tag {
      display: inline-block;
      font-size: 0.68rem;
      padding: 2px 6px;
      border-radius: 4px;
      margin-top: 4px;
      font-weight: bold;
    }
    .diet-tag.pork {
      background: rgba(229, 9, 20, 0.15);
      color: #ff6b6b;
      border: 1px solid rgba(229, 9, 20, 0.3);
    }
    .diet-tag.halal {
      background: rgba(40, 167, 69, 0.15);
      color: #5dd579;
      border: 1px solid rgba(40, 167, 69, 0.3);
    }

    /* 辣度选择器 */
    .spice-ctrl {
      margin-top: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .spice-label {
      font-size: 0.72rem;
      color: var(--gold);
      font-weight: bold;
    }
    .spice-select {
      background: #1f1f1f;
      color: #fff;
      border: 1px solid #404040;
      padding: 3px 6px;
      border-radius: 5px;
      font-size: 0.75rem;
      outline: none;
    }

    .dinner-tag {
      display: inline-block;
      background: rgba(229, 9, 20, 0.2);
      color: #ff6b6b;
      font-size: 0.65rem;
      padding: 1px 6px;
      border-radius: 4px;
      margin-top: 3px;
      border: 1px solid rgba(229, 9, 20, 0.4);
    }

    .qty-ctrl {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-qty {
      background: #262626;
      color: #fff;
      border: 1px solid #404040;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      font-size: 1rem;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .btn-qty:active {
      background: var(--accent);
    }

    .qty-num {
      font-weight: bold;
      font-size: 0.95rem;
      min-width: 15px;
      text-align: center;
    }

    .bottom-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(12, 12, 12, 0.97);
      backdrop-filter: blur(10px);
      border-top: 1px solid var(--card-border);
      padding: 10px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 -4px 15px rgba(0,0,0,0.8);
      z-index: 100;
    }

    .total-label {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .total-amount {
      color: var(--gold);
      font-size: 1.15rem;
      font-weight: bold;
    }

    .btn-submit {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 10px 22px;
      border-radius: 22px;
      font-weight: bold;
      font-size: 0.9rem;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(229, 9, 20, 0.5);
    }

    .btn-submit:disabled {
      background: #262626;
      color: #666;
      box-shadow: none;
      cursor: not-allowed;
    }

    /* 管理员弹窗样式 */
    .admin-modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.8);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    .admin-modal {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 20px;
      width: 90%;
      max-width: 360px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.8);
    }
    .admin-modal h2 {
      font-size: 1.2rem;
      margin-bottom: 16px;
      text-align: center;
      color: var(--text-main);
    }
    .admin-section {
      margin-bottom: 16px;
    }
    .admin-label {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 6px;
      display: block;
    }
    .admin-input {
      width: 100%;
      background: #1f1f1f;
      border: 1px solid #404040;
      color: #fff;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.9rem;
      outline: none;
    }
    .btn-group-toggle {
      display: flex;
      gap: 6px;
    }
    .btn-toggle {
      flex: 1;
      background: #1f1f1f;
      border: 1px solid #404040;
      color: var(--text-muted);
      padding: 8px 4px;
      border-radius: 6px;
      font-size: 0.78rem;
      font-weight: bold;
      cursor: pointer;
      text-align: center;
    }
    .btn-toggle.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    .admin-actions {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }
    .btn-admin-save {
      flex: 1;
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 10px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-admin-cancel {
      flex: 1;
      background: #262626;
      color: #fff;
      border: 1px solid #404040;
      padding: 10px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <button class="lang-btn" id="langToggleBtn" onclick="toggleLanguage()">EN / 中文</button>
    <h1 onclick="handleHeaderClick()">TOP <span>POT</span></h1>
    <div class="sub-title">K BBQ & HOT POT · STATEN ISLAND, NY</div>
    <div class="table-badge" id="tableDisplay">桌号加载中...</div>
  </header>

  <div class="session-switcher">
    <button class="session-btn active" id="lunchBtn" onclick="switchSession('lunch')">☀️ LUNCH (午市)</button>
    <button class="session-btn" id="dinnerBtn" onclick="switchSession('dinner')">🌙 DINNER (晚市专享)</button>
  </div>

  <div class="main-type-tabs">
    <div class="main-tab active" id="mainTab-bbq" onclick="switchMainType('bbq')">🔥 K-BBQ 烤肉区</div>
    <div class="main-tab" id="mainTab-hotpot" onclick="switchMainType('hotpot')">🍲 HOT POT 火锅区</div>
    <div class="main-tab" id="mainTab-drink" onclick="switchMainType('drink')">🥤 DRINKS 饮料区</div>
  </div>

  <div class="sub-type-tabs" id="subTypeTabs"></div>

  <main>
    <div class="menu-list" id="menuList"></div>
  </main>

  <div class="bottom-bar">
    <div>
      <div class="total-label" id="cartLabelText">当前已选加单</div>
      <div class="total-amount" id="totalCountDisplay">0 样菜品</div>
    </div>
    <button class="btn-submit" id="submitBtn" onclick="submitOrder()" disabled>请选择菜品</button>
  </div>

  <!-- 管理员设置弹窗 -->
  <div id="adminModal" class="admin-modal-overlay" style="display: none;">
    <div class="admin-modal">
      <h2 id="adminModalTitle">⚙️ 管理员设置</h2>
      
      <div class="admin-section">
        <label class="admin-label" id="adminTableLabel">桌号设置：</label>
        <input type="text" id="adminTableInput" class="admin-input" />
      </div>

      <div class="admin-section">
        <label class="admin-label" id="adminSessionLabel">Session 锁定：</label>
        <div class="btn-group-toggle">
          <button class="btn-toggle" id="sLock-none" onclick="setSessionLockTemp('none')">不锁定</button>
          <button class="btn-toggle" id="sLock-lunch" onclick="setSessionLockTemp('lunch')">仅 Lunch</button>
          <button class="btn-toggle" id="sLock-dinner" onclick="setSessionLockTemp('dinner')">仅 Dinner</button>
        </div>
      </div>

      <div class="admin-section">
        <label class="admin-label" id="adminTypeLabel">品类锁定：</label>
        <div class="btn-group-toggle">
          <button class="btn-toggle" id="tLock-none" onclick="setTypeLockTemp('none')">不锁定</button>
          <button class="btn-toggle" id="tLock-hotpot" onclick="setTypeLockTemp('hotpot')">仅 Hot Pot</button>
          <button class="btn-toggle" id="tLock-bbq" onclick="setTypeLockTemp('bbq')">仅 BBQ</button>
        </div>
      </div>

      <div class="admin-actions">
        <button class="btn-admin-cancel" onclick="closeAdminModal()">取消</button>
        <button class="btn-admin-save" onclick="saveAdminModal()">保存并应用</button>
      </div>
    </div>
  </div>

    let clickTimer = null;

    let adminLocks = JSON.parse(localStorage.getItem('top_pot_locks')) || {
      sessionLock: 'none', // 'none', 'lunch', 'dinner'
      typeLock: 'none'      // 'none', 'hotpot', 'bbq'
    };

    let tempSessionLock = 'none';
    let tempTypeLock = 'none';

    function saveAdminLocks() {
      localStorage.setItem('top_pot_locks', JSON.stringify(adminLocks));
      applyAdminLocks();
    }

    function applyAdminLocks() {
      // 处理 Session 锁
      if (adminLocks.sessionLock === 'lunch') {
        currentSession = 'lunch';
      } else if (adminLocks.sessionLock === 'dinner') {
        currentSession = 'dinner';
      }

      const lunchBtn = document.getElementById('lunchBtn');
      const dinnerBtn = document.getElementById('dinnerBtn');
      
      lunchBtn.classList.toggle('disabled-btn', adminLocks.sessionLock === 'dinner');
      dinnerBtn.classList.toggle('disabled-btn', adminLocks.sessionLock === 'lunch');

      lunchBtn.classList.toggle('active', currentSession === 'lunch');
      dinnerBtn.classList.toggle('active', currentSession === 'dinner');

      // 处理 Type 锁
      if (adminLocks.typeLock === 'hotpot') {
        currentMain = 'hotpot';
      } else if (adminLocks.typeLock === 'bbq') {
        currentMain = 'bbq';
      }

      const bbqTab = document.getElementById('mainTab-bbq');
      const hotpotTab = document.getElementById('mainTab-hotpot');

      bbqTab.classList.toggle('disabled-btn', adminLocks.typeLock === 'hotpot');
      hotpotTab.classList.toggle('disabled-btn', adminLocks.typeLock === 'bbq');

      bbqTab.classList.toggle('active', currentMain === 'bbq');
      hotpotTab.classList.toggle('active', currentMain === 'hotpot');
    }

    function handleHeaderClick() {
      clickCount++;
      clearTimeout(clickTimer);
      clickTimer = setTimeout(() => { clickCount = 0; }, 2000);

      // 修改为 5 次触发隐藏菜单
      if (clickCount >= 5) {
        clickCount = 0;
        openAdminModal();
      }
    }

    function openAdminModal() {
      const currentTable = localStorage.getItem('top_pot_table') || '1';
      document.getElementById('adminTableInput').value = currentTable;

      tempSessionLock = adminLocks.sessionLock;
      tempTypeLock = adminLocks.typeLock;

      updateModalToggleUI();

      if (currentLang === 'en') {
        document.getElementById('adminModalTitle').innerText = "⚙️ Admin Settings";
        document.getElementById('adminTableLabel').innerText = "Table Number:";
        document.getElementById('adminSessionLabel').innerText = "Session Lock:";
        document.getElementById('adminTypeLabel').innerText = "Type Lock:";
        document.getElementById('sLock-none').innerText = "No Lock";
        document.getElementById('sLock-lunch').innerText = "Lunch Only";
        document.getElementById('sLock-dinner').innerText = "Dinner Only";
        document.getElementById('tLock-none').innerText = "No Lock";
        document.getElementById('tLock-hotpot').innerText = "Hot Pot Only";
        document.getElementById('tLock-bbq').innerText = "BBQ Only";
      } else {
        document.getElementById('adminModalTitle').innerText = "⚙️ 管理员设置";
        document.getElementById('adminTableLabel').innerText = "桌号设置：";
        document.getElementById('adminSessionLabel').innerText = "Session 锁定：";
        document.getElementById('adminTypeLabel').innerText = "品类锁定：";
        document.getElementById('sLock-none').innerText = "不锁定";
        document.getElementById('sLock-lunch').innerText = "仅 Lunch";
        document.getElementById('sLock-dinner').innerText = "仅 Dinner";
        document.getElementById('tLock-none').innerText = "不锁定";
        document.getElementById('tLock-hotpot').innerText = "仅 Hot Pot";
        document.getElementById('tLock-bbq').innerText = "仅 BBQ";
      }

      document.getElementById('adminModal').style.display = 'flex';
    }

    function closeAdminModal() {
      document.getElementById('adminModal').style.display = 'none';
    }

    function setSessionLockTemp(val) {
      tempSessionLock = val;
      updateModalToggleUI();
    }

    function setTypeLockTemp(val) {
      tempTypeLock = val;
      updateModalToggleUI();
    }

    function updateModalToggleUI() {
      ['none', 'lunch', 'dinner'].forEach(v => {
        const btn = document.getElementById(`sLock-${v}`);
        if (btn) btn.classList.toggle('active', tempSessionLock === v);
      });

      ['none', 'hotpot', 'bbq'].forEach(v => {
        const btn = document.getElementById(`tLock-${v}`);
        if (btn) btn.classList.toggle('active', tempTypeLock === v);
      });
    }

    function saveAdminModal() {
      const newTable = document.getElementById('adminTableInput').value.trim();
      if (newTable) {
        localStorage.setItem('top_pot_table', newTable);
        updateTableDisplay();
      }

      adminLocks.sessionLock = tempSessionLock;
      adminLocks.typeLock = tempTypeLock;

      saveAdminLocks();
      renderSubTabs();
      renderMenu();
      closeAdminModal();
    }

    function getTableNumber() {
      const urlParams = new URLSearchParams(window.location.search);
      let table = urlParams.get('table');
      if (table) {
        localStorage.setItem('top_pot_table', table);
      } else {
        table = localStorage.getItem('top_pot_table') || '1';
      }
      return table;
    }

    function updateTableDisplay() {
      const t = getTableNumber();
      document.getElementById('tableDisplay').innerText = currentLang === 'zh' ? `当前桌号：${t} 号桌` : `Table: #${t}`;
    }

    updateTableDisplay();

    let currentSession = 'lunch';
    let currentMain = 'bbq';
    let currentSub = 'all';
    
    // 购物车格式: { "101_Medium": { id: 101, qty: 1, spice: "Medium" }, "1": { id: 1, qty: 2 } }
    let cart = {};

    function switchSession(session) {
      if ((session === 'lunch' && adminLocks.sessionLock === 'dinner') ||
          (session === 'dinner' && adminLocks.sessionLock === 'lunch')) {
        return;
      }

      currentSession = session;
      document.getElementById('lunchBtn').classList.toggle('active', session === 'lunch');
      document.getElementById('dinnerBtn').classList.toggle('active', session === 'dinner');

      if (session === 'lunch') {
        for (const cartKey in cart) {
          const itemId = cart[cartKey].id;
          const item = menuData.find(i => i.id == itemId);
          if (item && item.dinnerOnly) delete cart[cartKey];
        }
      }
      renderMenu();
    }

    function switchMainType(mainType) {
      if ((mainType === 'hotpot' && adminLocks.typeLock === 'bbq') ||
          (mainType === 'bbq' && adminLocks.typeLock === 'hotpot')) {
        return;
      }

      currentMain = mainType;
      currentSub = 'all';
      document.getElementById('mainTab-bbq').classList.toggle('active', mainType === 'bbq');
      document.getElementById('mainTab-hotpot').classList.toggle('active', mainType === 'hotpot');
      document.getElementById('mainTab-drink').classList.toggle('active', mainType === 'drink');
      renderSubTabs();
      renderMenu();
    }

    function renderSubTabs() {
      const subTabsContainer = document.getElementById('subTypeTabs');
      subTabsContainer.innerHTML = '';

      let subs = [];
      if (currentMain === 'bbq') {
        subs = currentLang === 'zh' ? [
          { key: 'all', name: '全部烤肉' },
          { key: 'beef', name: '🥩 烤牛肉' },
          { key: 'pork', name: '🥓 烤猪肉' },
          { key: 'chicken', name: '🍗 烤鸡肉' },
          { key: 'seafood', name: '🦐 烤海鲜' },
          { key: 'veg', name: '🥬 烤蔬菜' }
        ] : [
          { key: 'all', name: 'All BBQ' },
          { key: 'beef', name: '🥩 Beef' },
          { key: 'pork', name: '🥓 Pork' },
          { key: 'chicken', name: '🍗 Chicken' },
          { key: 'seafood', name: '🦐 Seafood' },
          { key: 'veg', name: '🥬 Veg' }
        ];
      } else if (currentMain === 'hotpot') {
        subs = currentLang === 'zh' ? [
          { key: 'all', name: '全部火锅' },
          { key: 'soup', name: '🍲 锅底' },
          { key: 'meat', name: '🥩 肉类' },
          { key: 'seafood', name: '🦐 海鲜' },
          { key: 'sides', name: '🍡 丸滑副食' },
          { key: 'soybean', name: '🧈 豆制品' },
          { key: 'veg', name: '🥬 蔬菜菌菇' },
          { key: 'noodle', name: '🍜 主食面类' }
        ] : [
          { key: 'all', name: 'All Hot Pot' },
          { key: 'soup', name: '🍲 Soup' },
          { key: 'meat', name: '🥩 Meats' },
          { key: 'seafood', name: '🦐 Seafood' },
          { key: 'sides', name: '🍡 Sides' },
          { key: 'soybean', name: '🧈 Soy Bean' },
          { key: 'veg', name: '🥬 Vegetables' },
          { key: 'noodle', name: '🍜 Noodles' }
        ];
      } else if (currentMain === 'drink') {
        subs = currentLang === 'zh' ? [
          { key: 'all', name: '全部饮料' },
          { key: 'refill', name: '🥤 畅饮汽水' },
          { key: 'juice', name: '🧃 鲜果汁' },
          { key: 'specialty', name: '罐装饮品' }
        ] : [
          { key: 'all', name: 'All Drinks' },
          { key: 'refill', name: '🥤 Soft Drinks' },
          { key: 'juice', name: '🧃 Juices' },
          { key: 'specialty', name: ' Canned Drinks' }
        ];
      }

      subs.forEach(s => {
        const btn = document.createElement('button');
        btn.className = `sub-tab ${currentSub === s.key ? 'active' : ''}`;
        btn.innerText = s.name;
        btn.onclick = () => {
          currentSub = s.key;
          renderSubTabs();
          renderMenu();
        };
        subTabsContainer.appendChild(btn);
      });
    }

    function renderMenu() {
      const list = document.getElementById('menuList');
      list.innerHTML = '';
      let totalCount = 0;

      // 统计购物车总数
      Object.keys(cart).forEach(k => {
        totalCount += cart[k].qty;
      });

      let filteredItems = menuData.filter(i => i.main === currentMain);
      if (currentSub !== 'all') {
        filteredItems = filteredItems.filter(i => i.sub === currentSub);
      }

      let lastGroup = '';
      filteredItems.forEach(item => {
        const isDinnerLocked = (currentSession === 'lunch' && item.dinnerOnly);

        const groupName = currentLang === 'zh' ? item.groupZh : item.groupEn;
        if (groupName !== lastGroup) {
          lastGroup = groupName;
          const groupTitle = document.createElement('div');
          groupTitle.className = 'section-title';
          groupTitle.innerText = lastGroup;
          list.appendChild(groupTitle);
        }

        const itemName = currentLang === 'zh' ? item.nameZh : item.nameEn;
        const itemDesc = currentLang === 'zh' ? item.descZh : item.descEn;
        const tagText = currentLang === 'zh' ? '🌙 仅限 Dinner 晚市提供' : '🌙 Dinner Only';

        // 拼接猪肉/清真成分提示
        let dietTagHtml = '';
        if (item.isPork) {
          dietTagHtml = `<div class="diet-tag pork">${currentLang === 'zh' ? '⚠️ Contains Pork (含猪肉)' : '⚠️ Contains Pork'}</div>`;
        } else if (item.isHalal) {
          dietTagHtml = `<div class="diet-tag halal">${currentLang === 'zh' ? '✅ Halal Friendly (清真友好)' : '✅ Halal Friendly'}</div>`;
        }

        // 显示价格（如有）
        let priceHtml = item.price ? `<div class="item-price">${item.price}</div>` : '';

        // 辣度下拉选框 (支持根据 spiceOptions 自定义选项)
        let spiceSelectHtml = '';
        if (item.hasSpiciness) {
          const allowedSpices = item.spiceOptions || ['Mild', 'Medium', 'Hot'];
          let optionsHtml = '';

          if (allowedSpices.includes('Mild')) {
            optionsHtml += `<option value="Mild" ${allowedSpices.length === 1 ? 'selected' : ''}>${currentLang === 'zh' ? '微辣 Mild' : 'Mild'}</option>`;
          }
          if (allowedSpices.includes('Medium')) {
            optionsHtml += `<option value="Medium" selected>${currentLang === 'zh' ? '中辣 Medium' : 'Medium'}</option>`;
          }
          if (allowedSpices.includes('Hot')) {
            optionsHtml += `<option value="Hot">${currentLang === 'zh' ? '大辣 Hot' : 'Hot'}</option>`;
          }

          spiceSelectHtml = `
            <div class="spice-ctrl">
              <span class="spice-label">${currentLang === 'zh' ? '辣度:' : 'Spice:'}</span>
              <select class="spice-select" id="spice-${item.id}">
                ${optionsHtml}
              </select>
            </div>
          `;
        }

        // 计算该菜品在购物车里的总数量
        let itemCartQty = 0;
        Object.keys(cart).forEach(key => {
          if (cart[key].id === item.id) {
            itemCartQty += cart[key].qty;
          }
        });

        const card = document.createElement('div');
        card.className = `item-card ${isDinnerLocked ? 'disabled-item' : ''}`;
        card.innerHTML = `
          <div class="item-info">
            <div class="item-name">${itemName}</div>
            <div class="item-desc">${itemDesc}</div>
            ${priceHtml}
            ${dietTagHtml}
            ${spiceSelectHtml}
            ${item.dinnerOnly ? `<div class="dinner-tag">${tagText}</div>` : ''}
          </div>
          <div class="qty-ctrl">
            ${itemCartQty > 0 ? `<button class="btn-qty" onclick="updateQty(${item.id}, -1)">-</button><span class="qty-num">${itemCartQty}</span>` : ''}
            <button class="btn-qty" ${isDinnerLocked ? 'disabled style="opacity:0.3"' : ''} onclick="updateQty(${item.id}, 1)">+</button>
          </div>
        `;
        list.appendChild(card);
      });

      const countText = currentLang === 'zh' ? `${totalCount} 份菜品` : `${totalCount} items`;
      document.getElementById('totalCountDisplay').innerText = countText;
      
      const submitBtn = document.getElementById('submitBtn');
      if (totalCount > 0) {
        submitBtn.disabled = false;
        submitBtn.innerText = currentLang === 'zh' ? `发送加单 (${totalCount}份) 🔥` : `Submit Order (${totalCount}) 🔥`;
      } else {
        submitBtn.disabled = true;
        submitBtn.innerText = currentLang === 'zh' ? "请选择菜品" : "Select Items";
      }
    }

    function updateQty(id, change) {
      const item = menuData.find(i => i.id === id);
      let selectedSpice = null;

      if (item && item.hasSpiciness) {
        const spiceElem = document.getElementById(`spice-${id}`);
        const defaultSpice = (item.spiceOptions && item.spiceOptions.length > 0) ? item.spiceOptions[0] : 'Medium';
        selectedSpice = spiceElem ? spiceElem.value : defaultSpice;
      }

      // 生成唯一的 key
      const cartKey = selectedSpice ? `${id}_${selectedSpice}` : `${id}`;
      const currentQty = cart[cartKey] ? cart[cartKey].qty : 0;

      if (change > 0 && currentQty >= MAX_QTY) {
        const msg = currentLang === 'zh' ? `单项菜品单次点餐上限为 ${MAX_QTY} 份` : `Maximum limit for each item is ${MAX_QTY}`;
        alert(msg);
        return;
      }

      if (change > 0) {
        if (!cart[cartKey]) {
          cart[cartKey] = { id: id, qty: 1, spice: selectedSpice };
        } else {
          cart[cartKey].qty += 1;
        }
      } else {
        // 减少逻辑：若有多种辣度，先扣除当前选中的辣度，若没有则扣除最早匹配的一项
        if (cart[cartKey]) {
          cart[cartKey].qty -= 1;
          if (cart[cartKey].qty <= 0) delete cart[cartKey];
        } else {
          // 查找匹配 id 的第一项进行扣减
          const targetKey = Object.keys(cart).find(k => cart[k].id === id);
          if (targetKey) {
            cart[targetKey].qty -= 1;
            if (cart[targetKey].qty <= 0) delete cart[targetKey];
          }
        }
      }

      renderMenu();
    }

    function submitOrder() {
      const orderItems = [];
      let totalCount = 0;

      for (const cartKey in cart) {
        const cartItem = cart[cartKey];
        const item = menuData.find(i => i.id == cartItem.id);
        if (item) {
          totalCount += cartItem.qty;
          const n = currentLang === 'zh' ? item.nameZh : item.nameEn;
          const priceText = item.price ? ` (${item.price})` : '';
          const spiceText = cartItem.spice ? ` [辣度: ${cartItem.spice}]` : '';
          orderItems.push(`- **${n}**${priceText}${spiceText} x${cartItem.qty}`);
        }
      }

      if (orderItems.length === 0) return;

      let fullToken = "";
      try {
        fullToken = atob((s1 + s2).trim());
      } catch (e) {
        alert("❌ 密钥解密失败");
        return;
      }

      const currentTable = getTableNumber();
      const sessionName = currentSession === 'lunch' ? (currentLang === 'zh' ? 'Lunch 午市' : 'Lunch') : (currentLang === 'zh' ? 'Dinner 晚市' : 'Dinner');
      const issueTitle = `【${currentTable}号桌】${sessionName}加单 (${totalCount}份)`;
      const issueBody = `### 🍽️ 点单详情\n**桌号：** ${currentTable}号\n**时段：** ${sessionName}\n**时间：** ${new Date().toLocaleString()}\n\n**加点清单：**\n${orderItems.join('\n')}`;

      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;
      submitBtn.innerText = currentLang === 'zh' ? "正在呼叫后厨..." : "Sending...";

      fetch(`https://api.github.com/repos/${repoOwner}/${repoName}/issues`, {
        method: 'POST',
        headers: {
          'Authorization': `token ${fullToken}`,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          title: issueTitle,
          body: issueBody
        })
      })
      .then(res => {
        if (res.ok) {
          alert(currentLang === 'zh' ? `✅ 加单成功已送达后厨！\n桌号: ${currentTable}号 (${sessionName})` : `✅ Order sent successfully!\nTable: #${currentTable} (${sessionName})`);
          cart = {};
          renderMenu();
        } else {
          alert(`❌ 提交失败 Status: ${res.status}`);
          submitBtn.disabled = false;
          submitBtn.innerText = currentLang === 'zh' ? "发送加单 🔥" : "Submit Order 🔥";
        }
      })
      .catch(() => {
        alert('❌ 网络连接错误');
        submitBtn.disabled = false;
        submitBtn.innerText = currentLang === 'zh' ? "发送加单 🔥" : "Submit Order 🔥";
      });
    }

    applyAdminLocks();
    renderSubTabs();
    renderMenu();
  </script>
</body>
</html>
