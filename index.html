<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TOP POT HOT POT - 在线点餐</title>
  <style>
    :root {
      --bg: #121212;
      --card: #1e1e1e;
      --accent: #e60012;
      --gold: #f5af19;
      --text: #ffffff;
      --text-muted: #aaaaaa;
      --border: #333333;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 15px;
      padding-bottom: 100px;
    }

    header {
      text-align: center;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 15px;
    }

    h1 {
      color: var(--gold);
      font-size: 1.5rem;
      letter-spacing: 1px;
    }

    .table-badge {
      display: inline-block;
      margin-top: 6px;
      background: #2a2a2a;
      color: var(--gold);
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 0.85rem;
      font-weight: bold;
      border: 1px solid var(--gold);
    }

    .menu-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 12px;
    }

    .item-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .item-name {
      font-weight: bold;
      font-size: 1rem;
      margin-bottom: 6px;
    }

    .item-price {
      color: var(--gold);
      font-weight: bold;
      font-size: 1.1rem;
    }

    .qty-ctrl {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 10px;
      background: #151515;
      border-radius: 6px;
      padding: 2px;
    }

    .btn-qty {
      background: #2a2a2a;
      color: #fff;
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 4px;
      font-size: 1.2rem;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-qty:active {
      background: var(--accent);
    }

    .qty-num {
      font-weight: bold;
      font-size: 0.95rem;
    }

    .bottom-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #1a1a1a;
      border-top: 1px solid var(--border);
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 -4px 15px rgba(0,0,0,0.5);
      z-index: 100;
    }

    .total-label {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .total-amount {
      color: var(--gold);
      font-size: 1.3rem;
      font-weight: bold;
    }

    .btn-submit {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 12px 24px;
      border-radius: 25px;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(230, 0, 18, 0.4);
    }

    .btn-submit:disabled {
      background: #555;
      box-shadow: none;
    }
  </style>
</head>
<body>

  <header>
    <h1>🍲 TOP POT HOT POT</h1>
    <div class="table-badge" id="tableDisplay">桌号加载中...</div>
  </header>

  <main>
    <div class="menu-grid" id="menuGrid"></div>
  </main>

  <div class="bottom-bar">
    <div>
      <div class="total-label">合计金额</div>
      <div class="total-amount" id="totalPrice">$0.00</div>
    </div>
    <button class="btn-submit" onclick="submitOrder()">下单 (店员确认)</button>
  </div>

  <script>
    // ==========================================
    // 1. Token 前 39 位设置
    // ==========================================
    const TOKEN_PREFIX = "ghp_JSpnM4SakqkQD23pBMc4balH5qvuKt346p0"; 
    const repoOwner = "HenryC0619";
    const repoName = "top-pot-menu";

    // 读取 URL 中的桌号参数，如 ?table=3
    const urlParams = new URLSearchParams(window.location.search);
    const currentTable = urlParams.get('table') || '未指定';
    document.getElementById('tableDisplay').innerText = `${currentTable} 号桌`;

    // 菜单数据
    const menuData = [
      { id: 1, name: "招牌麻辣锅底", price: 6.99 },
      { id: 2, name: "番茄鸳鸯锅底", price: 7.99 },
      { id: 3, name: "极品雪花牛", price: 12.99 },
      { id: 4, name: "特级安格斯牛肉", price: 14.99 },
      { id: 5, name: "手工鲜虾滑", price: 8.99 },
      { id: 6, name: "四川香辣毛肚", price: 7.99 },
      { id: 7, name: "黄金响铃卷", price: 4.99 },
      { id: 8, name: "有机蔬菜拼盘", price: 6.50 }
    ];

    let cart = {};

    // 渲染菜单
    function renderMenu() {
      const grid = document.getElementById('menuGrid');
      grid.innerHTML = '';
      let total = 0;

      menuData.forEach(item => {
        const qty = cart[item.id] || 0;
        total += qty * item.price;

        const card = document.createElement('div');
        card.className = 'item-card';
        card.innerHTML = `
          <div>
            <div class="item-name">${item.name}</div>
            <div class="item-price">$${item.price.toFixed(2)}</div>
          </div>
          <div class="qty-ctrl">
            <button class="btn-qty" onclick="updateQty(${item.id}, -1)">-</button>
            <span class="qty-num">${qty}</span>
            <button class="btn-qty" onclick="updateQty(${item.id}, 1)">+</button>
          </div>
        `;
        grid.appendChild(card);
      });

      document.getElementById('totalPrice').innerText = `$${total.toFixed(2)}`;
    }

    // 修改菜品数量
    function updateQty(id, change) {
      cart[id] = (cart[id] || 0) + change;
      if (cart[id] <= 0) delete cart[id];
      renderMenu();
    }

    // 提交订单功能
    function submitOrder() {
      const orderItems = [];
      let total = 0;

      for (const id in cart) {
        const item = menuData.find(i => i.id == id);
        if (item) {
          const itemTotal = item.price * cart[id];
          total += itemTotal;
          orderItems.push(`- **${item.name}** x${cart[id]} ($${itemTotal.toFixed(2)})`);
        }
      }

      if (orderItems.length === 0) {
        alert('请先选择菜品！');
        return;
      }

      // 2. 提示框要求服务员输入单字母确认码
      const pinCode = prompt(`【${currentTable}号桌】订单总额：$${total.toFixed(2)}\n\n请服务员输入确认码：`);

      if (!pinCode) {
        alert("已取消提交");
        return;
      }

      // 拼接完整的 Token
      const fullToken = TOKEN_PREFIX.trim() + pinCode.trim();

      const issueTitle = `【${currentTable}号桌】新订单`;
      const issueBody = `### 🍽️ 订单详情\n**桌号：** ${currentTable}号\n**下单时间：** ${new Date().toLocaleString()}\n\n**菜品清单：**\n${orderItems.join('\n')}\n\n**总计金额：** $${total.toFixed(2)}`;

      const submitBtn = document.querySelector('.btn-submit');
      submitBtn.disabled = true;
      submitBtn.innerText = "正在发送...";

      // 发送到 GitHub Issues
      fetch(`https://api.github.com/repos/${repoOwner}/${repoName}/issues`, {
        method: 'POST',
        headers: {
          'Authorization': `token ${fullToken}`,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          title: issueTitle,
          body: issueBody
        })
      })
      .then(res => {
        if (res.ok) {
          alert(`✅ 订单已成功提交到厨房！\n桌号: ${currentTable}号`);
          cart = {};
          renderMenu();
        } else {
          alert('❌ 验证码错误或权限不足，订单发送失败！');
        }
      })
      .catch(err => {
        alert('❌ 网络连接错误，请检查网络后重试。');
      })
      .finally(() => {
        submitBtn.disabled = false;
        submitBtn.innerText = "下单 (店员确认)";
      });
    }

    // 页面初始化
    renderMenu();
  </script>
</body>
</html>
